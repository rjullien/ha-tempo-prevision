# Dashboard basique — Tempo Prévision (cartes natives HA)

title: Tempo Prévision
views:
  - title: Prévisions
    path: previsions
    icon: mdi:calendar-week
    cards:
      - type: entities
        title: Couleurs officielles (RTE / rtetempo)
        entities:
          - entity: sensor.rte_tempo_couleur_actuelle
            name: Aujourd'hui
          - entity: sensor.rte_tempo_prochaine_couleur
            name: Demain

      - type: markdown
        title: Prévisions Open DPE (J+2..J+7)
        content: |
          | Jour | Couleur | Probabilité |
          |------|---------|-------------|
          {% set day_names = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'] %}
          {% for i in range(2, 8) %}
          {% set sensor = 'sensor.rte_tempo_forecast_opendpe_j' ~ i %}
          {% set couleur = states(sensor) %}
          {% set proba = state_attr(sensor, 'probability') %}
          {% set indicator = state_attr(sensor, 'indicator') %}
          {% set date = now() + timedelta(days=i) %}
          {% set jour = day_names[date.weekday()] %}
          {% set emoji = '🔴' if couleur == 'Rouge' else ('⚪' if couleur == 'Blanc' else '🔵') %}
          {% set info = 'Dimanche' if indicator == 'D' else ('Férié' if indicator == 'F' else ((proba * 100) | round ~ '%' if proba else '-')) %}
          | {{ jour }} | {{ emoji }} {{ couleur }} | {{ info }} |
          {% endfor %}

  - title: Précision
    path: precision
    icon: mdi:chart-line
    cards:
      - type: glance
        title: Précision (J-2, 30 jours)
        entities:
          - entity: sensor.rte_tempo_forecast_accuracy
            name: Précision
            icon: mdi:percent

      - type: markdown
        title: Historique (passé)
        content: |
          {% set matrix = state_attr('sensor.rte_tempo_forecast_accuracy', 'past_matrix') %}
          {% macro color_emoji(c) %}{% if c == 'rouge' %}🔴{% elif c == 'blanc' %}⚪{% elif c == 'bleu' %}🔵{% else %}--{% endif %}{% endmacro %}
          {% macro cell(jdata) %}{% if jdata and jdata.color %}{{ color_emoji(jdata.color) }}{% if jdata.result == '✓' %}✓{% elif jdata.result == '✗' %}✗{% endif %}{% else %}--{% endif %}{% endmacro %}
          | Date  |  J-7  |  J-6  |  J-5  |  J-4  |  J-3  |  J-2  | Réel  |
          |:-----:|:-----:|:-----:|:-----:|:-----:|:-----:|:-----:|:-----:|
          {% if matrix %}{% for row in matrix[:15] %}| {{ row.date[5:] }} | {{ cell(row.j7) }} | {{ cell(row.j6) }} | {{ cell(row.j5) }} | {{ cell(row.j4) }} | {{ cell(row.j3) }} | {{ cell(row.j2) }} | {{ color_emoji(row.actual) }} |
          {% endfor %}{% endif %}
